# Publish exactly the v1.1.0 website release once a main-branch Pages deploy succeeds.
# A release is created only if the checked-out package.json is version 1.1.0.
name: Publish LangSteps v1.1.0

on:
  workflow_run:
    workflows: ["Deploy LangSteps to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    name: Validate deployment and publish
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Confirm v1.1.0 source and release notes
        run: |
          node -e "if(require('./package.json').version !== '1.1.0') process.exit(1)"
          test -f docs/releases/v1.1.0-public.md

      - name: Run curriculum regressions
        run: npm test

      - name: Type-check and build
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Build ASP.NET Core backend
        run: dotnet build server/LangSteps.Server/LangSteps.Server.csproj -c Release --warnaserror

      - name: Verify live Pages lesson routes
        run: |
          for module in Go SQL CSharp; do
            curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
              "https://sanskarin.github.io/LangSteps/${module}/index.html" \
              | grep -q 'id="course-title"'
          done

      - name: Publish GitHub release and tag v1.1.0 (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "v1.1.0 is already published; skipping."
            exit 0
          fi
          gh release create v1.1.0 \
            --target "$DEPLOYED_SHA" \
            --title "LangSteps v1.1.0 — Go, SQL & C# Learning Paths" \
            --notes-file docs/releases/v1.1.0-public.md \
            --latest
