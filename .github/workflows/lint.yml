name: Lint New Curricula HTML

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["release/**"]

concurrency:
  group: langsteps-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint new course pages and progressive API reference
        run: npx --yes htmlhint "Go/index.html" "SQL/index.html" "CSharp/index.html" "api-reference.html" "offline-library.html"

# TODO: Expand lint coverage after historical HTML debt is cleared.
# The pre-v1.1 baseline reported 263 HTMLHint findings across 50 of 97 pages.
# Existing legacy pages are not silently counted as passing lint.

  legacy-html-report:
    name: Legacy HTMLHint inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local HTMLHint
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Record non-blocking full-repository HTML findings
        run: npm run audit:html
      - name: Upload HTMLHint diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: langsteps-htmlhint-baseline
          path: |
            reports/htmlhint-baseline.json
            reports/htmlhint-baseline.md
          if-no-files-found: warn
