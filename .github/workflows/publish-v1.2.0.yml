name: Publish LangSteps v1.2.0

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: langsteps-v1.2.0-publish
  cancel-in-progress: false

jobs:
  publish:
    # Only the explicitly titled, reviewed merge commit can trigger publishing.
    if: contains(github.event.head_commit.message, 'LangSteps v1.2.0 [publish]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify exact release version and notes
        run: |
          test "$(node -p 'require("./package.json").version')" = '1.2.0'
          test -s docs/releases/v1.2.0-public.md
          ! grep -q '^## \[1.2.0\] — In development' CHANGELOG.md
      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript, curriculum, generated assets and Node tests
        run: |
          npm run validate:curriculum
          npm test
          npm run typecheck
          npm run typecheck:curriculum
          npm run typecheck:sw
          npm run typecheck:online
          npm run build
          npm run build:curriculum
          npm run build:sw
          npm run build:online
          git diff --exit-code -- sw.js curriculum/progress.js curriculum/navigation.js curriculum/donation.js curriculum/learning.js curriculum/api-reference.js online-status.js
      - name: Lint v1.2.0 content pages
        run: npx htmlhint Go/index.html SQL/index.html CSharp/index.html api-reference.html
      - name: Build and smoke-test optional ASP.NET Core backend
        run: |
          dotnet build server/LangSteps.Server/LangSteps.Server.csproj -c Release --warnaserror
          bash tests/api-smoke.sh
      - name: Test Chromium Firefox and WebKit with pinned Playwright image
        run: |
          docker run --rm --ipc=host \
            -v "$PWD":/workspace -w /workspace \
            -e CI=true -e HOME=/root mcr.microsoft.com/playwright:v1.64.0-noble \
            npm run test:browser
      - name: Publish stable release only after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "v1.2.0 already exists; refusing to publish again."
            exit 1
          fi
          gh release create v1.2.0 --target "$GITHUB_SHA" \
            --title 'LangSteps v1.2.0 — TypeScript Foundations & Learning Reliability' \
            --notes-file docs/releases/v1.2.0-public.md --latest
