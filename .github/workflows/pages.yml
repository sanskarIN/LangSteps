name: Deploy LangSteps to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-v1-1-1:
    name: Publish v1.1.1 after successful Pages deployment
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm the checked-out release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "1.1.1" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping the one-time v1.1.1 publisher for version $version"
          fi
      - name: Create stable release exactly once
        if: steps.version.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.1 >/dev/null 2>&1; then
            echo "Stable v1.1.1 release is already published."
            exit 0
          fi
          if ! git rev-parse -q --verify refs/tags/v1.1.1 >/dev/null; then
            git config user.name "Sanskar"
            git config user.email "sanskarin@outlook.in"
            git tag -a v1.1.1 -m "LangSteps v1.1.1 stable"
            git push origin refs/tags/v1.1.1
          fi
          gh release create v1.1.1 \
            --title "LangSteps v1.1.1 — Reliability & Learning Quality" \
            --notes-file docs/releases/v1.1.1-public.md \
            --verify-tag \
            --latest
