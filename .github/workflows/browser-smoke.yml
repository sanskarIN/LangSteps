name: Browser Smoke — All Engines

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: langsteps-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium:
    name: Browser checks — ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install browser engines
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test live browser behavior against a local copy
        run: npm run test:browser -- --project=${{ matrix.engine }}
      - name: Save traces and screenshots when browser checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: langsteps-browser-smoke-${{ matrix.engine }}-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
