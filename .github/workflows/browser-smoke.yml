name: Browser Smoke — All Engines

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: langsteps-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Chromium Firefox WebKit integration checks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run cross-engine browser and offline tests
        env:
          HOME: /root
        run: npm run test:browser
      - name: Save traces and screenshots when browser checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: langsteps-cross-browser-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
