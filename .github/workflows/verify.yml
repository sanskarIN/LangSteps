name: Verify LangSteps
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  curriculum-and-typescript:
    name: Curriculum tests & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate course content and local routes
        run: npm test
      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Check shared curriculum TypeScript
        run: npm run typecheck:curriculum
      - name: Compile browser curriculum module and verify tracked output
        run: npm run build:curriculum && git diff --exit-code -- curriculum/progress.js
      - name: Compile TypeScript
        run: npm run build

  aspnet-backend:
    name: ASP.NET Core build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build backend with warnings as errors
        run: dotnet build server/LangSteps.Server/LangSteps.Server.csproj --configuration Release --warnaserror
      - name: Smoke-test quiz privacy and invalid submissions
        run: bash tests/api-smoke.sh
